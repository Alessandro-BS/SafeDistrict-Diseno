# =============================================
# SafeDistrict Backend - application.properties
# =============================================
# Las credenciales se leen desde el archivo .env
# en la raíz del proyecto (via DotenvEnvironmentPostProcessor).

spring.application.name=safedistrict-backend

# ----- Servidor -----
server.port=${SERVER_PORT:8080}

# ----- Base de datos PostgreSQL -----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:safedistrict_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----- Spring AI - Google GenAI (Gemini) -----
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
spring.ai.google.genai.chat.options.temperature=0.3
spring.ai.google.genai.chat.options.max-output-tokens=500

# ----- CORS (para React en desarrollo) -----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ----- Swagger / OpenAPI -----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
